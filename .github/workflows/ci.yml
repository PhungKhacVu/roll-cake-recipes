name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting with Ruff
      run: |
        ruff check src/ tests/
      continue-on-error: true

    - name: Run type checking with MyPy
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true

    - name: Run unit tests with pytest
      run: |
        pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy bandit

    - name: Check code formatting with Black
      run: |
        black --check src/ tests/
      continue-on-error: true

    - name: Run security scan with Bandit
      run: |
        bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json

  data-validation:
    name: Validate Recipe Data
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydantic pandas

    - name: Validate CSV data
      run: |
        python -c "
        from src.infrastructure.repositories import CSVRecipeRepository
        try:
            repo = CSVRecipeRepository()
            recipes = repo.get_all()
            print(f'✅ Successfully validated {len(recipes)} recipes')
            print(f'✅ No duplicate IDs found')
            print(f'✅ All data passes Pydantic validation')
        except Exception as e:
            print(f'❌ Data validation failed: {e}')
            exit(1)
        "

  build:
    name: Build and Test API
    runs-on: ubuntu-latest
    needs: [test, code-quality]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start API server in background
      run: |
        python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
        sleep 5

    - name: Health check
      run: |
        curl -f http://localhost:8000/health || exit 1

    - name: Test API endpoints
      run: |
        # Test root endpoint
        curl -f http://localhost:8000/ || exit 1

        # Test recipes endpoint
        curl -f http://localhost:8000/api/v1/recipes?limit=5 || exit 1

        # Test statistics endpoint
        curl -f http://localhost:8000/api/v1/stats || exit 1

        echo "✅ All API endpoints are working"

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, code-quality, data-validation, build]
    if: always()

    steps:
    - name: Check job status
      run: |
        echo "Test: ${{ needs.test.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Data Validation: ${{ needs.data-validation.result }}"
        echo "Build: ${{ needs.build.result }}"
